<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — MoneyTracker</title>
  <style>
    :root {
      --bg: #0B0F19;
      --card: #131B2E;
      --border: #232D42;
      --text: #F1F5F9;
      --muted: #94A3B8;
      --accent: #2563EB;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F8FAFC;
        --card: #FFFFFF;
        --border: #E2E8F0;
        --text: #0F172A;
        --muted: #64748B;
        --accent: #2563EB;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 1rem;
      background: rgba(37, 99, 235, 0.12);
      color: var(--accent);
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 0.9375rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    button {
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 0.75rem;
      padding: 0.75rem 1.75rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">
      <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-12.728 0m0 0l2.829-2.829m-2.829 2.829L3 21m2.828-15.364a9 9 0 0112.728 0M8.464 8.464a5 5 0 000 7.072m0 0l2.829-2.829M1 1l22 22" />
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>MoneyTracker needs a network connection to fetch new updates. Your local pending transactions remain securely queued in your browser.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </main>
</body>
</html>
