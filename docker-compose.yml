services:
  postgres:
    image: postgres:16-alpine
    container_name: moneytracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneytracker
      POSTGRES_PASSWORD: moneytracker_dev_password
      POSTGRES_DB: moneytracker_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneytracker -d moneytracker_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
