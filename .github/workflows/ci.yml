name: CI / Verification Suite

on:
  push:
    branches: [main, v3-fullstack]
  pull_request:
    branches: [main, v3-fullstack]

jobs:
  lint-and-build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm --workspace=@moneytracker/api run prisma:generate

      - name: Build All Workspaces
        run: npm run build

  test-suite:
    name: Monorepo Tests
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm --workspace=@moneytracker/api run prisma:generate

      - name: Run @moneytracker/shared Tests (100% pure math/schemas)
        run: npm --workspace=@moneytracker/shared test

      - name: Run @moneytracker/web Tests (components, context, sync queue)
        run: npm --workspace=@moneytracker/web test

      - name: Run @moneytracker/api Tests (routes, scheduler, tenant isolation, migration)
        run: npm --workspace=@moneytracker/api test
